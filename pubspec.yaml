name: masruf
description: Personal daily expense tracker (Kurdish).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5
  fl_chart: ^1.0.0
  intl: any
  shared_preferences: ^2.5.3
  share_plus: ^11.0.0
  flutter_animate: ^4.5.2
  package_info_plus: ^8.0.0
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# App icon: assets/icon/*.png and all platform icons are drawn by
# tool/make_icon.py (python3 tool/make_icon.py). flutter_launcher_icons can
# regenerate the platform icons from the same PNGs if needed.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0E2147"
  adaptive_icon_foreground: assets/icon/foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
