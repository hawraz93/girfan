name: Build APK

# Every merge to main builds a release APK and publishes it as a GitHub
# Release, so it can be downloaded and installed straight from a phone.
# Pull requests get the same build (as a downloadable artifact) to catch errors
# before merging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Sign with the real release key so every APK can update the installed
      # app without losing data. The keystore is kept in the repo encrypted
      # (android/app/release-keystore.enc); ANDROID_KEYSTORE_PASSWORD unlocks it.
      # A release signed with a throwaway key could never be updated later,
      # so published releases must use the real key.
      - name: Require release key for published builds
        if: github.event_name != 'pull_request' && env.KEYSTORE_PASS == ''
        run: |
          echo "::error::Add the ANDROID_KEYSTORE_PASSWORD secret before publishing a release."
          exit 1

      - name: Set up release signing
        if: env.KEYSTORE_PASS != ''
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/release-keystore.enc -out android/app/upload-keystore.jks \
            -pass env:KEYSTORE_PASS \
            || { echo "::error::Could not decrypt the keystore: check ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASS" -alias girfan > /dev/null \
            || { echo "::error::Keystore password or alias is wrong."; exit 1; }
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASS
          keyAlias=girfan
          keyPassword=$KEYSTORE_PASS
          EOF

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee /tmp/build.log

      # Failure logs go to the ci-logs branch so they can be read without
      # downloading artifacts.
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && cd /tmp/logs
          tail -n 300 /tmp/build.log > build-tail.log 2>/dev/null || echo "no log" > build-tail.log
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Build log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Name the APK
        id: apk
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          name="girfan-${version}-build${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.file }}
          body: |
            APK for ${{ github.sha }}.
            Download the .apk below on your phone and open it to install.

      # The app checks this public repo for new versions (the code repo is
      # private, so the app could not read its releases without a login).
      - name: Publish to public releases repo
        if: github.event_name != 'pull_request' && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/girfan-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.file }}
          make_latest: "true"
          body: Girfan ${{ steps.apk.outputs.tag }}
